name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Kotlin errors, then Gradle's "What went wrong" block, as one readable annotation
          { grep -E '^e: ' build.log | head -40; grep -A 12 'What went wrong' build.log | head -30; } > errors.txt || true
          [ -s errors.txt ] || tail -40 build.log > errors.txt
          msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ReelCraft-0.1.${{ github.run_number }}.apk

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: ReelCraft-0.1.${{ github.run_number }}
          path: ReelCraft-0.1.${{ github.run_number }}.apk

      - name: Publish a test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ReelCraft 0.1.${{ github.run_number }} (test build)
          prerelease: true
          body: |
            Test build for Android 8.0 and newer.
            Download the .apk file below on your phone, open it, and allow installing from this source when asked.
          files: ReelCraft-0.1.${{ github.run_number }}.apk
