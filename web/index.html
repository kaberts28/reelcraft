<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: editor shell. 9:16 stage on the left, tool panel on the right, timeline strip across the bottom. Stacks stage > timeline > tools on phones. Deliberately dark-only, like an edit suite. */
:root{
  color-scheme:dark;
  --bg:#141519; --panel:#1C1E24; --raise:#262932; --line:#323541;
  --fg:#EDEBE6; --muted:#9A9CA8; --accent:#F4B53F; --accent-ink:#1E1606;
  --teal:#5FD0C3; --danger:#F07167;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{accent-color:var(--accent);width:100%}

.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 32px;display:grid;gap:14px;
  grid-template-columns:auto minmax(0,1fr);grid-template-areas:"top top" "stage panel" "tl tl"}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "tl" "panel"}}

.top{grid-area:top;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:800 24px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--accent);position:relative}
.brand i::after{content:"";position:absolute;left:8px;top:6px;border-left:8px solid var(--accent-ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.chip{font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 9px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}

.stage{grid-area:stage;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
#view{display:block;height:min(62vh,640px);width:auto;max-width:100%;border-radius:14px;background:#000;box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.45)}
@media (max-width:820px){#view{height:min(58vh,560px)}}
.transport{display:flex;align-items:center;gap:10px;width:100%;max-width:380px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px}
.tc{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.tl{grid-area:tl;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tlhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tlhead h2{font:700 13px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.zoom{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--muted)}
.zoom input{width:110px}
.scroller{overflow-x:auto;padding-bottom:6px}
.lane{display:flex;align-items:stretch;gap:10px;width:max-content}
.track{position:relative;display:flex;height:76px;cursor:pointer;border-radius:8px;overflow:hidden;background:#0E0F12}
.blk{position:relative;flex:none;height:100%;border-right:2px solid #0E0F12;background-size:auto 100%;background-repeat:repeat-x;overflow:hidden}
.blk::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,15,18,.15),rgba(14,15,18,.85))}
.blk .cap{position:absolute;left:6px;right:6px;bottom:20px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .dur{position:absolute;left:6px;bottom:5px;font:500 10px/1 var(--f-mono);color:var(--muted)}
.blk.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.blk.sel .dur{color:var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--fg)}
.addtile{flex:none;width:76px;height:76px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;cursor:pointer}
.addtile:hover{border-color:var(--accent);color:var(--fg)}

.panel{grid-area:panel;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pbody h3{font:800 19px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field label output{font:500 12px var(--f-mono);color:var(--fg);text-transform:none;letter-spacing:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.txt{width:100%;background:#121317;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.txt:focus{border-color:var(--accent);outline:none}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:0}
.media{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--raise);border-radius:8px;padding:6px;min-width:0}
.mrow img{width:36px;height:64px;object-fit:cover;border-radius:5px;flex:none;background:#000}
.mrow .mn{flex:1;min-width:0}
.mrow .mn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mrow .mn span{font:500 11px var(--f-mono);color:var(--muted)}
.caps{display:flex;flex-direction:column;gap:8px}
.caprow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.caprow .tc{min-width:92px}
.caprow.sel .tc{color:var(--accent)}
.wave{width:100%;height:96px;display:block;background:#0E0F12;border-radius:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font:800 26px/1 var(--f-display);color:var(--teal);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#0E0F12;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.result video{width:100%;max-width:240px;border-radius:10px;background:#000;display:block}
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--teal);margin-right:9px;vertical-align:1px}
.checks li.warn::before{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10}
.vault{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
.drop{position:fixed;inset:0;background:rgba(20,21,25,.88);display:grid;place-items:center;font:800 28px var(--f-display);color:var(--accent);z-index:20;border:3px dashed var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>

<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>ReelCraft</div>
    <span class="chip">Prototype v0.1</span>
    <span class="spacer"></span>
    <label class="btn primary" for="fileIn">Add clips</label>
    <input id="fileIn" class="sr" type="file" accept="video/*,audio/*" multiple>
  </header>

  <section class="stage" aria-label="Preview">
    <canvas id="view" width="540" height="960"></canvas>
    <div class="transport">
      <button class="play" id="playBtn" aria-label="Play"></button>
      <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position">
      <span class="tc" id="tcode">0:00.0 / 0:00.0</span>
    </div>
  </section>

  <section class="tl" aria-label="Timeline">
    <div class="tlhead">
      <h2>Timeline</h2>
      <span class="tc" id="tlinfo"></span>
      <div class="zoom"><label for="zoomIn">Zoom</label><input id="zoomIn" type="range" min="16" max="140" value="44"></div>
    </div>
    <div class="scroller" id="scroller">
      <div class="lane">
        <div class="track" id="track"></div>
        <label class="addtile" for="fileIn">+ Add<br>clip</label>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="Tools">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="edit">Edit</button>
      <button role="tab" data-tab="cut">Auto-cut</button>
      <button role="tab" data-tab="caps">Captions</button>
      <button role="tab" data-tab="audio">Audio</button>
      <button role="tab" data-tab="export">Export</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </section>
</div>
<div class="vault" id="vault" aria-hidden="true"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="drop" id="drop" hidden>Drop clips to add them</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60);return m+':'+(t-m*60).toFixed(1).padStart(4,'0')};
let uid=0;const nid=()=>'x'+(++uid);
const ICON_PLAY='<svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3l12 7-12 7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 3h4v14H4zM12 3h4v14h-4z"/></svg>';

const S={sources:[],pieces:[],sel:null,playing:false,idx:0,tl:0,tab:'edit',
  style:'pop',capPos:.72,capSize:1,fit:'fill',hook:'Free editor. No watermark.',hookSecs:3,
  clipVol:1,musicVol:.35,music:null,res:720,pps:44,exporting:false,
  cut:{sens:.3,pause:.45,pad:.1},cutSrc:null,lastCut:null,out:null,progress:0};

/* ---------- audio graph ---------- */
let A=null,clipBus,musicGain,master,recDest;
function ensureAudio(){
  if(A){if(A.state==='suspended')A.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  A=new AC();master=A.createGain();master.connect(A.destination);
  try{recDest=A.createMediaStreamDestination();master.connect(recDest)}catch(e){recDest=null}
  clipBus=A.createGain();clipBus.gain.value=S.clipVol;clipBus.connect(master);
  musicGain=A.createGain();musicGain.gain.value=S.musicVol;musicGain.connect(master);
  S.sources.forEach(wire);wireMusic();
}
function wire(src){
  if(!A||src.wired)return;src.wired=true;
  if(src.kind==='video'){try{A.createMediaElementSource(src.el).connect(clipBus)}catch(e){}}
  else{src.abuf=A.createBuffer(1,src.samples.length,src.sr);src.abuf.getChannelData(0).set(src.samples)}
}
function wireMusic(){
  const m=S.music;if(!A||!m||m.wired)return;
  try{A.createMediaElementSource(m.el).connect(musicGain)}catch(e){}m.wired=true;
}

/* ---------- sources ---------- */
function sTime(s){if(s.kind==='video')return s.el.currentTime;const d=s.demo;return d.playing?d.offset+(A.currentTime-d.t0):d.offset}
function sPlay(s){
  if(s.kind==='video'){s.el.play().catch(()=>{});return}
  const d=s.demo;if(d.playing||!A)return;
  const n=A.createBufferSource();n.buffer=s.abuf;n.connect(clipBus);
  n.start(0,Math.min(Math.max(0,d.offset),s.duration-.01));d.node=n;d.t0=A.currentTime;d.playing=true;
}
function sPause(s){
  if(s.kind==='video'){s.el.pause();return}
  const d=s.demo;if(!d.playing)return;d.offset=sTime(s);try{d.node.stop()}catch(e){}d.playing=false;
}
function sSeek(s,t){
  if(s.kind==='video'){try{s.el.currentTime=t}catch(e){}return}
  const d=s.demo,was=d.playing;if(was)sPause(s);d.offset=t;if(was)sPlay(s);
}
function computeEnv(src,samples,sr){
  const hop=.02,w=Math.max(1,Math.round(sr*hop)),n=Math.floor(samples.length/w);
  const lin=new Float32Array(n),db=new Float32Array(n);
  for(let i=0;i<n;i++){let a=0;for(let k=i*w,e=k+w;k<e;k++)a+=samples[k]*samples[k];const r=Math.sqrt(a/w);lin[i]=r;db[i]=20*Math.log10(r+1e-6)}
  let mx=0;for(const v of lin)if(v>mx)mx=v;
  src.hop=hop;src.envLin=lin;src.envDb=db;src.envMax=mx||1;
}
async function analyze(src){
  if(src.envDb)return true;
  try{
    const buf=await src.file.arrayBuffer();
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const oc=new OC(1,2,44100);
    const ab=await new Promise((res,rej)=>{const p=oc.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
    const n=ab.length,mono=new Float32Array(n);
    for(let c=0;c<ab.numberOfChannels;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)mono[i]+=d[i]/ab.numberOfChannels}
    computeEnv(src,mono,ab.sampleRate);return true;
  }catch(e){return false}
}

/* demo clip: a drawn presenter who talks in four bursts with pauses between */
function makeDemo(){
  const sr=22050,dur=12,len=sr*dur,smp=new Float32Array(len);
  const talk=[[.35,2.55],[3.9,6.1],[7.55,9.65],[10.6,11.7]];let ph=0;
  for(let i=0;i<len;i++){
    const t=i/sr;let v=(Math.random()*2-1)*.0025;
    const f0=135+22*Math.sin(6.283*.7*t)+9*Math.sin(6.283*3.1*t);ph+=6.2832*f0/sr;
    for(const [a,b] of talk){if(t>=a&&t<b){const l=t-a;const edge=Math.min(1,l/.05,(b-t)/.05);
      const syl=.35+.65*(.5-.5*Math.cos(6.2832*4.2*l));
      v+=.22*edge*syl*(Math.sin(ph)+.5*Math.sin(2*ph)+.28*Math.sin(3*ph)+.12*Math.sin(5*ph));}}
    smp[i]=v;
  }
  const cv=document.createElement('canvas');cv.width=360;cv.height=640;
  const src={id:nid(),kind:'demo',name:'Demo clip',duration:dur,samples:smp,sr,cv,demo:{offset:0,playing:false}};
  computeEnv(src,smp,sr);paintDemo(src,1.2);src.thumb=cv.toDataURL('image/jpeg',.6);
  return src;
}
function paintDemo(src,t){
  const c=src.cv.getContext('2d'),W=360,H=640;
  const g=c.createLinearGradient(0,0,W,H);
  g.addColorStop(0,`hsl(${(205+t*6)%360} 42% 26%)`);g.addColorStop(1,`hsl(${(250+t*6)%360} 45% 12%)`);
  c.fillStyle=g;c.fillRect(0,0,W,H);
  c.fillStyle='rgba(255,255,255,.05)';
  for(let i=0;i<5;i++){c.beginPath();c.arc(60+i*70,120+30*Math.sin(t*.8+i),26+i*4,0,6.283);c.fill()}
  const ei=Math.min(src.envLin.length-1,Math.max(0,Math.floor(t/src.hop)));
  const e=Math.min(1,src.envLin[ei]/src.envMax*1.25);
  const bob=Math.sin(t*1.6)*3;
  c.fillStyle='#2F7F78';c.beginPath();c.ellipse(180,560+bob,120,120,0,Math.PI,0);c.fill();c.fillRect(60,560+bob,240,90);
  c.fillStyle='#C98D63';c.fillRect(162,388+bob,36,50);
  c.beginPath();c.arc(180,320+bob,78,0,6.283);c.fill();
  c.fillStyle='#1F1A17';c.beginPath();c.arc(180,300+bob,80,Math.PI*1.02,Math.PI*1.98);c.fill();
  const blink=(t%3.4)<.12;c.fillStyle='#1F1A17';
  [152,208].forEach(x=>{c.beginPath();c.ellipse(x,318+bob,7,blink?1.5:8,0,0,6.283);c.fill()});
  c.fillStyle='#5A1F22';c.beginPath();c.ellipse(180,360+bob,17,3+e*17,0,0,6.283);c.fill();
  c.fillStyle='rgba(255,255,255,.55)';c.font='500 13px "JetBrains Mono", monospace';c.textAlign='left';
  c.fillText('DEMO CLIP  '+t.toFixed(1)+'s',18,H-20);
  c.fillStyle='#F07167';c.beginPath();c.arc(W-26,H-25,5,0,6.283);c.fill();
}
const vault=$('#vault');
function once(el,ev,ms){return new Promise(r=>{let done=false;const f=()=>{if(done)return;done=true;el.removeEventListener(ev,f);r()};el.addEventListener(ev,f);setTimeout(f,ms||2500)})}
function makeVideoSrc(file){
  return new Promise(res=>{
    const v=document.createElement('video');v.preload='auto';v.playsInline=true;v.setAttribute('playsinline','');
    v.src=URL.createObjectURL(file);vault.appendChild(v);
    v.onerror=()=>{v.remove();res(null)};
    v.onloadedmetadata=async()=>{
      let d=v.duration;
      if(!isFinite(d)){v.currentTime=1e7;await once(v,'seeked');d=v.duration;if(!isFinite(d))d=v.currentTime||10}
      v.currentTime=Math.min(.5,d/3);await once(v,'seeked');
      const tc=document.createElement('canvas');tc.width=72;tc.height=128;
      try{drawMedia(tc.getContext('2d'),v,v.videoWidth,v.videoHeight,72,128,'fill')}catch(e){}
      let thumb='';try{thumb=tc.toDataURL('image/jpeg',.6)}catch(e){}
      res({id:nid(),kind:'video',name:file.name,file,el:v,duration:d,thumb});
    };
  });
}

/* ---------- timeline model ---------- */
const pdur=p=>p.end-p.start;
const total=()=>S.pieces.reduce((a,p)=>a+pdur(p),0);
const srcOf=p=>S.sources.find(s=>s.id===p.src);
function startOf(i){let a=0;for(let k=0;k<i;k++)a+=pdur(S.pieces[k]);return a}
function locate(t){let acc=0;for(let i=0;i<S.pieces.length;i++){const d=pdur(S.pieces[i]);if(t<acc+d||i===S.pieces.length-1)return{i,off:Math.min(Math.max(0,t-acc),d)};acc+=d}return null}
function seekTL(t){
  const wasPlaying=S.playing;if(wasPlaying)pause();
  t=Math.max(0,Math.min(t,total()));S.tl=t;const L=locate(t);if(!L)return;
  S.idx=L.i;const p=S.pieces[L.i];sSeek(srcOf(p),p.start+Math.min(L.off,pdur(p)-.01));
  if(wasPlaying)play();
}
function play(){
  if(!S.pieces.length)return;ensureAudio();
  if(S.tl>=total()-.05)S.tl=0;
  const L=locate(S.tl);S.idx=L.i;const p=S.pieces[L.i],s=srcOf(p);
  sSeek(s,p.start+L.off);sPlay(s);S.playing=true;
  const m=S.music;if(m){const d=m.el.duration;if(isFinite(d)&&d>0)m.el.currentTime=S.tl%d;m.el.play().catch(()=>{})}
  syncPlayBtn();
}
function pause(){S.playing=false;S.sources.forEach(sPause);if(S.music)S.music.el.pause();syncPlayBtn()}
function syncPlayBtn(){const b=$('#playBtn');b.innerHTML=S.playing?ICON_PAUSE:ICON_PLAY;b.setAttribute('aria-label',S.playing?'Pause':'Play')}

/* ---------- drawing ---------- */
const view=$('#view'),vctx=view.getContext('2d');
const ex=document.createElement('canvas'),exctx=ex.getContext('2d');
function drawMedia(c,img,iw,ih,W,H,fit){
  if(!iw||!ih)return;
  const cover=Math.max(W/iw,H/ih),contain=Math.min(W/iw,H/ih);
  if(fit==='fill'||Math.abs(cover-contain)<.01){const w=iw*cover,h=ih*cover;c.drawImage(img,(W-w)/2,(H-h)/2,w,h);return}
  c.save();if('filter' in c)c.filter='blur('+Math.round(W/28)+'px)';
  const w=iw*cover*1.12,h=ih*cover*1.12;c.drawImage(img,(W-w)/2,(H-h)/2,w,h);c.restore();
  c.fillStyle='rgba(0,0,0,.42)';c.fillRect(0,0,W,H);
  const w2=iw*contain,h2=ih*contain;c.drawImage(img,(W-w2)/2,(H-h2)/2,w2,h2);
}
function wrapWords(c,words,maxW){
  const lines=[];let cur=[];const sp=c.measureText(' ').width;let w=0;
  words.forEach((wd,i)=>{const ww=c.measureText(wd).width;if(cur.length&&w+sp+ww>maxW){lines.push(cur);cur=[];w=0}
    cur.push({wd,i,ww});w+=(cur.length>1?sp:0)+ww});
  if(cur.length)lines.push(cur);return{lines,sp};
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawCaption(c,text,prog,W,H){
  const st=S.style;let size,font,words=text.trim().split(/\s+/).filter(Boolean);if(!words.length)return;
  if(st==='pop'){size=W*.082*S.capSize;font=`${size}px Anton, Impact, "Arial Narrow", sans-serif`;words=words.map(w=>w.toUpperCase())}
  else if(st==='box'){size=W*.056*S.capSize;font=`800 ${size}px Figtree, "Segoe UI", sans-serif`}
  else{size=W*.058*S.capSize;font=`700 ${size}px Figtree, "Segoe UI", sans-serif`}
  c.font=font;c.textBaseline='middle';c.textAlign='left';
  const {lines,sp}=wrapWords(c,words,W*.84);const lh=size*(st==='pop'?1.12:1.35);
  const active=Math.min(words.length-1,Math.floor(Math.max(0,prog)*words.length));
  const y0=H*S.capPos-(lines.length-1)*lh/2;
  lines.forEach((ln,li)=>{
    const lw=ln.reduce((a,o)=>a+o.ww,0)+sp*(ln.length-1);let x=(W-lw)/2;const y=y0+li*lh;
    if(st==='box'){c.fillStyle='rgba(10,10,12,.78)';rr(c,x-size*.45,y-lh/2+size*.04,lw+size*.9,lh-size*.08,size*.28);c.fill()}
    ln.forEach(o=>{
      const on=o.i===active;
      if(st==='pop'){c.lineJoin='round';c.lineWidth=size*.17;c.strokeStyle='#000';c.strokeText(o.wd,x,y);c.fillStyle=on?'#FFD23F':'#FFFFFF';c.fillText(o.wd,x,y)}
      else if(st==='box'){c.fillStyle=on?'#F4B53F':'#FFFFFF';c.fillText(o.wd,x,y)}
      else{c.save();c.shadowColor='rgba(0,0,0,.75)';c.shadowBlur=size*.35;c.fillStyle='#FFFFFF';c.globalAlpha=on?1:.86;c.fillText(o.wd,x,y);c.restore()}
      x+=o.ww+sp;
    });
  });
}
function drawHook(c,W,H){
  const size=W*.062;c.font=`${size}px Anton, Impact, sans-serif`;c.textBaseline='middle';c.textAlign='center';
  const t=S.hook.toUpperCase();const {lines}=wrapWords(c,t.split(/\s+/),W*.78);const lh=size*1.25;
  lines.forEach((ln,i)=>{const s=ln.map(o=>o.wd).join(' ');const w=c.measureText(s).width;const y=H*.12+i*lh;
    c.fillStyle='#F4B53F';rr(c,(W-w)/2-size*.4,y-lh/2+2,w+size*.8,lh-4,size*.15);c.fill();
    c.fillStyle='#1E1606';c.fillText(s,W/2,y+1)});
}
function render(c,W,H){
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  const p=S.pieces[S.idx];
  if(!p){c.fillStyle='#9A9CA8';c.textAlign='center';c.textBaseline='middle';c.font=`600 ${W*.045}px Figtree, sans-serif`;c.fillText('Add a clip to start',W/2,H/2);return}
  const s=srcOf(p);
  if(s.kind==='video'){if(s.el.readyState>=2)drawMedia(c,s.el,s.el.videoWidth,s.el.videoHeight,W,H,S.fit)}
  else{paintDemo(s,sTime(s));drawMedia(c,s.cv,360,640,W,H,S.fit)}
  const d=pdur(p);const prog=d>0?(S.tl-startOf(S.idx))/d:0;
  if(p.caption)drawCaption(c,p.caption,prog,W,H);
  if(S.hook&&S.tl<S.hookSecs)drawHook(c,W,H);
}

/* ---------- main loop ---------- */
const scrub=$('#scrub'),tcode=$('#tcode'),track=$('#track'),scroller=$('#scroller');let scrubbing=false;
function frame(){
  if(S.playing){
    const p=S.pieces[S.idx];
    if(!p){endReached()}
    else{
      const s=srcOf(p),t=sTime(s);
      const ended=s.kind==='video'?s.el.ended:t>=s.duration-.01;
      if(t>=p.end-.015||ended){
        const nx=S.pieces[S.idx+1];
        if(!nx){S.tl=total();endReached()}
        else{const ns=srcOf(nx);if(ns!==s)sPause(s);S.idx++;sSeek(ns,nx.start);sPlay(ns);S.tl=startOf(S.idx)}
      }else S.tl=startOf(S.idx)+Math.max(0,t-p.start);
    }
  }
  if(S.exporting){render(exctx,ex.width,ex.height);vctx.drawImage(ex,0,0,view.width,view.height);
    const pr=Math.min(1,S.tl/Math.max(.01,total()));const b=$('#exbar');if(b)b.style.width=(pr*100).toFixed(1)+'%';
    const tx=$('#extext');if(tx)tx.textContent=`Recording ${fmt(S.tl)} of ${fmt(total())}`}
  else render(vctx,view.width,view.height);
  const T=total();
  if(!scrubbing){scrub.max=Math.max(.01,T);scrub.value=S.tl}
  tcode.textContent=fmt(S.tl)+' / '+fmt(T);
  const ph=$('#playhead');if(ph){const x=S.tl*S.pps;ph.style.left=x+'px';
    if(S.playing){const vl=scroller.scrollLeft,vw=scroller.clientWidth;if(x>vl+vw-40||x<vl)scroller.scrollLeft=x-40}}
  requestAnimationFrame(frame);
}
function endReached(){pause();if(S.exporting)setTimeout(()=>{if(S.rec&&S.rec.state!=='inactive')S.rec.stop()},250)}

/* ---------- UI: timeline ---------- */
function renderTL(){
  const parts=S.pieces.map((p,i)=>{const s=srcOf(p);const w=Math.max(2,pdur(p)*S.pps);
    return `<div class="blk${p.id===S.sel?' sel':''}" data-i="${i}" style="width:${w.toFixed(1)}px;background-image:url('${s.thumb||''}')" title="${esc(s.name)}">
      <span class="cap">${esc(p.caption||'')}</span><span class="dur">${pdur(p).toFixed(1)}s</span></div>`});
  track.innerHTML=parts.join('')+'<div class="playhead" id="playhead"></div>';
  track.style.width=Math.max(120,total()*S.pps)+'px';
  $('#tlinfo').textContent=`${S.pieces.length} piece${S.pieces.length===1?'':'s'} · ${fmt(total())}`;
}
track.addEventListener('pointerdown',e=>{
  if(S.exporting)return;const r=track.getBoundingClientRect();const t=(e.clientX-r.left)/S.pps;
  const L=locate(Math.min(t,total()-.01));if(!L)return;S.sel=S.pieces[L.i].id;seekTL(t);renderTL();renderPanel();
});
$('#zoomIn').addEventListener('input',e=>{S.pps=+e.target.value;renderTL()});

const pbody=$('#pbody');
function setTab(t){S.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));renderPanel()}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});
const selPiece=()=>S.pieces.find(p=>p.id===S.sel);

function preview(p,t){if(S.playing)pause();const i=S.pieces.indexOf(p);S.idx=i;S.tl=startOf(i)+(t-p.start);sSeek(srcOf(p),t)}
function split(){

function move(d){

  [S.pieces[i],S.pieces[j]]=[S.pieces[j],S.pieces[i]];renderTL();seekTL(startOf(j));renderPanel();
}
function del(){
  const i=S.pieces.findIndex(p=>p.id===S.sel);if(i<0)return;pause();S.pieces.splice(i,1);
  const n=S.pieces[Math.min(i,S.pieces.length-1)];S.sel=n?n.id:null;renderTL();seekTL(n?startOf(S.pieces.indexOf(n)):0);renderPanel();
}
function removeSource(id){
  pause();S.pieces=S.pieces.filter(p=>p.src!==id);const s=S.sources.find(x=>x.id===id);
  S.sources=S.sources.filter(x=>x.id!==id);if(s&&s.el){s.el.removeAttribute('src');s.el.remove()}
  if(S.cutSrc===id)S.cutSrc=null;if(!selPiece())S.sel=S.pieces[0]?S.pieces[0].id:null;

/* auto-cut */
function findSpeech(src){
  const db=src.envDb,hop=src.hop;if(!db||!db.length)return null;
  const s=Array.from(db).sort((a,b)=>a-b);const fl=s[Math.floor(s.length*.1)],pk=s[Math.floor(s.length*.97)];
  if(pk-fl<6)return{regs:[],thr:pk,fl,pk,flat:true};
  const thr=fl+(pk-fl)*S.cut.sens;let regs=[],st=-1;
  for(let i=0;i<=db.length;i++){const v=i<db.length&&db[i]>thr;if(v&&st<0)st=i;if(!v&&st>=0){regs.push([st*hop,i*hop]);st=-1}}
  const m=[];for(const r of regs){const l=m[m.length-1];if(l&&r[0]-l[1]<S.cut.pause)l[1]=r[1];else m.push(r.slice())}
  regs=m.filter(r=>r[1]-r[0]>=.2).map(r=>[Math.max(0,r[0]-S.cut.pad),Math.min(src.duration,r[1]+S.cut.pad)]);
  const out=[];for(const r of regs){const l=out[out.length-1];if(l&&r[0]<=l[1])l[1]=r[1];else out.push(r)}
  return{regs:out,thr,fl,pk};
}
function applyCut(src,quiet){
  const r=findSpeech(src);
  if(!r||r.flat){toast('This clip has no clear pauses to cut.');return false}
  if(!r.regs.length){toast('Nothing loud enough was found. Lower the threshold.');return false}
  const before=S.pieces.filter(p=>p.src===src.id).reduce((a,p)=>a+pdur(p),0)||src.duration;
  let at=S.pieces.findIndex(p=>p.src===src.id);if(at<0)at=S.pieces.length;
  S.pieces=S.pieces.filter(p=>p.src!==src.id);
  const np=r.regs.map(([a,b])=>({id:nid(),src:src.id,start:a,end:b,caption:''}));
  S.pieces.splice(at,0,...np);
  const after=np.reduce((a,p)=>a+pdur(p),0);
  S.lastCut={src:src.id,removed:Math.max(0,before-after),pauses:Math.max(0,np.length-1),after};
  S.sel=np[0].id;
  if(!quiet){pause();renderTL();seekTL(startOf(at));renderPanel();toast(`Removed ${(before-after).toFixed(1)}s of silence.`)}
  return true;
}
function pCut(){
  if(!S.cutSrc||!S.sources.find(s=>s.id===S.cutSrc)){const p=selPiece();S.cutSrc=p?p.src:(S.sources[0]&&S.sources[0].id)}
  const src=S.sources.find(s=>s.id===S.cutSrc);
  const lc=S.lastCut&&src&&S.lastCut.src===src.id?S.lastCut:null;
  pbody.innerHTML=`
  <div><h3>Cut the pauses out</h3><p class="lede">ReelCraft listens to your clip, finds the quiet gaps between sentences and removes them. Each spoken part becomes its own piece, ready for a caption.</p></div>
  ${S.sources.length>1?`<div class="field"><label for="cutSel">Clip</label><select id="cutSel" class="txt">${S.sources.map(s=>`<option value="${s.id}"${s.id===S.cutSrc?' selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`:''}
  ${src?`<canvas class="wave" id="wave" aria-label="Sound of the clip. Kept parts in teal, removed parts dimmed."></canvas>
  <div class="row tc"><span>0:00.0</span><span class="spacer"></span><span>Teal = kept · grey = cut · dashed line = threshold</span><span class="spacer"></span><span>${fmt(src.duration)}</span></div>`:'<p class="note">Add a clip first.</p>'}
  ${lc?`<div class="stats"><div class="stat"><b>${lc.removed.toFixed(1)}s</b><span>silence removed</span></div><div class="stat"><b>${lc.pauses}</b><span>pauses cut</span></div><div class="stat"><b>${fmt(lc.after)}</b><span>new length</span></div></div>`:''}
  <div class="grid2">
    <div class="field"><label for="cSens">Silence threshold <output>${Math.round(S.cut.sens*100)}%</output></label><input id="cSens" type="range" min="0.12" max="0.6" step="0.01" value="${S.cut.sens}"></div>
    <div class="field"><label for="cPause">Shortest pause to cut <output>${S.cut.pause.toFixed(2)}s</output></label><input id="cPause" type="range" min="0.2" max="1.5" step="0.05" value="${S.cut.pause}"></div>
    <div class="field"><label for="cPad">Breathing room <output>${S.cut.pad.toFixed(2)}s</output></label><input id="cPad" type="range" min="0" max="0.3" step="0.01" value="${S.cut.pad}"></div>
  </div>
  <div class="row"><button class="btn primary" id="bCut"${src?'':' disabled'}>Auto-cut this clip</button><button class="btn" id="bRestore"${src?'':' disabled'}>Restore full clip</button></div>
  <p class="note">A higher threshold cuts more aggressively. Breathing room keeps a little sound around each sentence so it doesn't feel chopped.</p>`;
  if(!src)return;
  const redraw=()=>drawWave(src);
  on('#cutSel','change',e=>{S.cutSrc=e.target.value;renderPanel()});
  ['cSens','cPause','cPad'].forEach(id=>on('#'+id,'input',e=>{const k={cSens:'sens',cPause:'pause',cPad:'pad'}[id];S.cut[k]=+e.target.value;
    e.target.previousElementSibling.querySelector('output').textContent=k==='sens'?Math.round(S.cut.sens*100)+'%':(+e.target.value).toFixed(2)+'s';redraw()}));
  on('#bCut','click',async e=>{e.target.disabled=true;e.target.textContent='Listening…';
    const ok=await analyze(src);if(!ok){toast("Couldn't read this clip's sound. It may have no audio track.");renderPanel();return}
    applyCut(src)});
  on('#bRestore','click',()=>{let at=S.pieces.findIndex(p=>p.src===src.id);if(at<0)at=S.pieces.length;
    S.pieces=S.pieces.filter(p=>p.src!==src.id);const np={id:nid(),src:src.id,start:0,end:src.duration,caption:''};S.pieces.splice(at,0,np);
    S.sel=np.id;S.lastCut=null;pause();renderTL();seekTL(startOf(at));renderPanel();toast('Full clip restored.')});
  requestAnimationFrame(redraw);
}
function drawWave(src){
  const cv=$('#wave');if(!cv)return;const dpr=window.devicePixelRatio||1;const W=cv.clientWidth,H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);c.clearRect(0,0,W,H);
  if(!src.envDb){c.fillStyle='#9A9CA8';c.font='600 13px Figtree, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('Tap "Auto-cut this clip" to analyze its sound',W/2,H/2);return}
  const r=findSpeech(src)||{};const db=src.envDb,n=db.length,fl=r.fl??-60,pk=r.pk??0;
  const keep=S.pieces.filter(p=>p.src===src.id);const kept=t=>keep.some(p=>t>=p.start&&t<p.end);
  const bw=W/n;
  for(let i=0;i<n;i++){const v=Math.max(0,Math.min(1,(db[i]-fl)/Math.max(1,pk-fl)));const h=Math.max(1.5,v*(H-12));
    c.fillStyle=kept(i*src.hop)?'#5FD0C3':'rgba(154,156,168,.35)';c.fillRect(i*bw,(H-h)/2,Math.max(1,bw-.3),h)}
  if(r.thr!=null){const v=(r.thr-fl)/Math.max(1,pk-fl);const y1=(H-v*(H-12))/2;c.strokeStyle='#F4B53F';c.setLineDash([4,4]);c.lineWidth=1;
    c.beginPath();c.moveTo(0,y1);c.lineTo(W,y1);c.moveTo(0,H-y1);c.lineTo(W,H-y1);c.stroke()}
}

      <input class="txt" data-cap="${i}" value="${esc(p.caption)}" placeholder="Type what's said here" aria-label="Caption for piece ${i+1}"></div>`}).join('')||'<p class="note">Add a clip to write captions.</p>'}
  </div></div>
  <p class="note">Tip: run Auto-cut first, so every sentence becomes its own piece. Automatic speech-to-text (English, Swahili, then Luganda) is planned for the Android app, running on the phone with no internet.</p>`;
  on('#stSeg','click',e=>{const b=e.target.closest('button');if(!b)return;S.style=b.dataset.v;pbody.querySelectorAll('#stSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  on('#capPos','input',e=>{S.capPos=+e.target.value;e.target.previousElementSibling.querySelector('output').textContent=Math.round(S.capPos*100)+'%'});
  on('#capSize','input',e=>{S.capSize=+e.target.value;e.target.previousElementSibling.querySelector('output').textContent=Math.round(S.capSize*100)+'%'});
  on('#hookT','input',e=>{S.hook=e.target.value;if(!S.playing)seekTL(0)});
  on('#hookS','input',e=>{S.hookSecs=+e.target.value;pbody.querySelector('label[for=hookT] output').textContent=S.hookSecs+'s'});
  pbody.querySelectorAll('[data-cap]').forEach(inp=>{
    inp.addEventListener('input',()=>{S.pieces[+inp.dataset.cap].caption=inp.value;const b=track.querySelector(`[data-i="${inp.dataset.cap}"] .cap`);if(b)b.textContent=inp.value});
    inp.addEventListener('focus',()=>{const i=+inp.dataset.cap;S.sel=S.pieces[i].id;if(!S.playing)seekTL(startOf(i)+Math.min(.4,pdur(S.pieces[i])/2));renderTL()});
  });
  pbody.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const i=+b.dataset.go;S.sel=S.pieces[i].id;seekTL(startOf(i));play();renderTL()});
}

/* audio */
function pAudio(){
  pbody.innerHTML=`
  <div><h3>Sound</h3><p class="lede">Balance your voice against background music. Music loops to fill the whole video.</p></div>
  <div class="field"><label for="vClip">Clip volume <output>${Math.round(S.clipVol*100)}%</output></label><input id="vClip" type="range" min="0" max="1.5" step="0.05" value="${S.clipVol}"></div>
  <div class="field"><span class="lab">Background music</span>
    ${S.music?`<div class="mrow"><div class="mn" style="padding:6px"><b>${esc(S.music.name)}</b><span>loops under the video</span></div><button class="btn sm ghost danger" id="mRm">Remove</button></div>`
      :`<div class="row"><label class="btn" for="musicIn">Choose a music file</label></div>`}
    <input id="musicIn" class="sr" type="file" accept="audio/*"></div>
  <div class="field"><label for="vMusic">Music volume <output>${Math.round(S.musicVol*100)}%</output></label><input id="vMusic" type="range" min="0" max="1" step="0.05" value="${S.musicVol}"></div>
  <p class="note">Use music you own or have permission to use. TikTok and Instagram may mute videos with copyrighted songs.</p>`;
  on('#vClip','input',e=>{S.clipVol=+e.target.value;if(clipBus)clipBus.gain.value=S.clipVol;e.target.previousElementSibling.querySelector('output').textContent=Math.round(S.clipVol*100)+'%'});
  on('#vMusic','input',e=>{S.musicVol=+e.target.value;if(musicGain)musicGain.gain.value=S.musicVol;else if(S.music)S.music.el.volume=S.musicVol;e.target.previousElementSibling.querySelector('output').textContent=Math.round(S.musicVol*100)+'%'});
  on('#musicIn','change',e=>{const f=e.target.files[0];if(f)setMusic(f)});
  on('#mRm','click',()=>{S.music.el.pause();S.music=null;renderPanel()});
}
function setMusic(f){
  if(S.music)S.music.el.pause();const a=new Audio();a.src=URL.createObjectURL(f);a.loop=true;a.volume=S.musicVol;
  S.music={el:a,name:f.name,wired:false};wireMusic();if(S.playing){pause();play()}
  if(S.tab==='audio')renderPanel();toast('Music added.');
}

/* export */
function pickMime(){
  if(!window.MediaRecorder)return null;
  const list=[['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','mp4'],['video/mp4;codecs=avc1,mp4a','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm;codecs=vp8,opus','webm'],['video/webm','webm']];
  for(const [m,e] of list){try{if(MediaRecorder.isTypeSupported(m))return{m,e}}catch(x){}}return null;
}
let downloads=null; // in a normal browser, export shows the video with a download link
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{downloads=d;if(S.tab==='export')renderPanel()}).catch(()=>{})}catch(e){}
function pExport(){
  const mime=pickMime();const T=total();const W=S.res===1080?1080:720,H=S.res===1080?1920:1280;
  pbody.innerHTML=`
  <div><h3>Export</h3><p class="lede">Your video plays through once while it records, so export takes as long as the video. Keep this tab open until it finishes.</p></div>
  <div class="field"><span class="lab">Quality</span><div class="seg" id="resSeg">
    <button data-v="720" aria-pressed="${S.res===720}">720p · smaller file</button><button data-v="1080" aria-pressed="${S.res===1080}">1080p · sharper</button></div></div>
  <ul class="checks">
    <li>Vertical ${W}×${H}, ready for TikTok, Reels, Shorts and WhatsApp Status</li>
    <li>No watermark</li>
    <li class="${T>60?'warn':''}">Length ${fmt(T)}${T>60?'. WhatsApp Status works best under a minute':''}</li>
    <li class="${mime&&mime.e==='webm'?'warn':''}">${mime?`Saves as ${mime.e.toUpperCase()}${mime.e==='webm'?'. Some apps prefer MP4; Safari and newer Chrome save MP4 directly':''}`:'This browser cannot record video. Try Chrome on Android or a computer.'}</li>
  </ul>
  ${S.exporting?`<div class="field"><span class="lab" id="extext">Recording…</span><div class="bar"><i id="exbar"></i></div><div class="row"><button class="btn sm" id="bCancel">Cancel</button></div></div>`
    :`<div class="row"><button class="btn primary" id="bExport"${!mime||!T?' disabled':''}>Export video</button></div>`}
  ${S.out&&!S.exporting?`<div class="field result"><span class="lab">Your video · ${(S.out.blob.size/1048576).toFixed(1)} MB</span>
    <video src="${S.out.url}" controls playsinline></video>
    <div class="row"><button class="btn primary" id="bSave">Save to device</button></div></div>`:''}`;
  on('#resSeg','click',e=>{const b=e.target.closest('button');if(!b)return;S.res=+b.dataset.v;renderPanel()});
  on('#bExport','click',doExport);on('#bCancel','click',()=>{S.cancel=true;endReached()});on('#bSave','click',saveOut);
}
async function doExport(){
  const mime=pickMime();if(!mime||!S.pieces.length||S.exporting)return;
  ensureAudio();pause();
  const W=S.res===1080?1080:720,H=S.res===1080?1920:1280;ex.width=W;ex.height=H;
  if(!ex.captureStream){toast("This browser can't record video.");return}
  const tracks=[...ex.captureStream(30).getVideoTracks()];if(recDest)tracks.push(...recDest.stream.getAudioTracks());
  let rec;try{rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime.m,videoBitsPerSecond:W===1080?8e6:4.5e6})}catch(e){toast("Recording couldn't start in this browser.");return}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{S.exporting=false;if(S.cancel){S.cancel=false;toast('Export cancelled.');renderPanel();return}
    if(S.out)URL.revokeObjectURL(S.out.url);const blob=new Blob(chunks,{type:mime.m.split(';')[0]});
    S.out={blob,ext:mime.e,url:URL.createObjectURL(blob)};renderPanel();toast('Export finished.')};
  S.rec=rec;S.cancel=false;S.exporting=true;seekTL(0);render(exctx,W,H);renderPanel();
  setTimeout(()=>{rec.start(250);play()},300);
}
async function saveOut(){
  if(!S.out)return;
  if(!downloads){const a=document.createElement('a');a.href=S.out.url;a.download='reelcraft.'+S.out.ext;document.body.appendChild(a);a.click();a.remove();return}
  const d=new Date();const stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
  try{await downloads.save({filename:`reelcraft-${stamp}.${S.out.ext}`,data:S.out.blob});toast('Saved.')}
  catch(e){const c=e&&e.code;toast(c==='declined'?'Save cancelled.':c==='rate_limited'?'A save prompt is already open.':c==='too_large'?'File too large. Try 720p.':"Couldn't save the file here.")}
}

/* ---------- import ---------- */
async function importFiles(files){
  const vids=[];
  for(const f of files){
    if(/^audio\//.test(f.type)){setMusic(f);continue}
    if(!/^video\//.test(f.type)&&!/\.(mp4|mov|webm|m4v|3gp|mkv)$/i.test(f.name))continue;
    toast('Opening '+f.name+'…');
    const s=await makeVideoSrc(f);if(!s){toast(`Couldn't open ${f.name}. Try an MP4 file.`);continue}
    vids.push(s);
  }
  if(!vids.length)return;
  pause();
  const demo=S.sources.find(s=>s.kind==='demo');
  if(demo){S.sources=S.sources.filter(s=>s!==demo);S.pieces=S.pieces.filter(p=>p.src!==demo.id);S.lastCut=null;S.cutSrc=null;
    if(S.hook==='Free editor. No watermark.')S.hook=''}
  let first=null;
  vids.forEach(s=>{S.sources.push(s);wire(s);const p={id:nid(),src:s.id,start:0,end:s.duration,caption:''};S.pieces.push(p);if(!first)first=p});
  S.sel=first.id;renderTL();seekTL(startOf(S.pieces.indexOf(first)));renderPanel();
  toast(demo?'Demo removed. Your clip is on the timeline.':`Added ${vids.length} clip${vids.length>1?'s':''}.`);
}
$('#fileIn').addEventListener('change',e=>{importFiles([...e.target.files]);e.target.value=''});
let dragN=0;const drop=$('#drop');
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragN++;drop.hidden=false}});
addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)drop.hidden=true});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;drop.hidden=true;if(e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])});

/* ---------- misc ---------- */
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2600)}
$('#playBtn').addEventListener('click',()=>{if(S.exporting)return;S.playing?pause():play()});
scrub.addEventListener('input',()=>{if(S.exporting)return;scrubbing=true;seekTL(+scrub.value);const L=locate(S.tl);if(L){S.sel=S.pieces[L.i].id}});
scrub.addEventListener('change',()=>{scrubbing=false;renderTL();if(S.tab==='edit'||S.tab==='caps')renderPanel()});
addEventListener('keydown',e=>{if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)){e.preventDefault();if(!S.exporting)(S.playing?pause():play())}});
addEventListener('resize',()=>{if(S.tab==='cut'){const s=S.sources.find(x=>x.id===S.cutSrc);if(s)drawWave(s)}});
if(document.fonts){['40px Anton','800 40px Figtree','700 40px Figtree'].forEach(f=>document.fonts.load(f).catch(()=>{}))}

/* ---------- boot with the demo ---------- */
const demo=makeDemo();S.sources.push(demo);
S.pieces.push({id:nid(),src:demo.id,start:0,end:demo.duration,caption:''});
applyCut(demo,true);
const lines=["Hi, I'm testing ReelCraft","It cut out all my pauses","Captions light up word by word","Now add your own clips"];
S.pieces.forEach((p,i)=>p.caption=lines[i]||'');
S.cutSrc=demo.id;S.sel=S.pieces[0].id;
syncPlayBtn();renderTL();seekTL(0);setTab('edit');
requestAnimationFrame(frame);
})();
</script>
</body></html>
